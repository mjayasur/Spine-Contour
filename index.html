<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spine-Contour</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #0d1117; color: #e6edf3; }
      main { width: min(920px, calc(100% - 40px)); margin: 36px auto; }
      h1 { margin-bottom: 6px; font-size: 30px; }
      p { color: #9da7b3; margin-top: 0; }
      .panel { background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 22px; }
      .controls { display: grid; grid-template-columns: 1.3fr repeat(3, 1fr); gap: 14px; align-items: end; }
      label { display: grid; gap: 7px; color: #b7c0ca; font-size: 13px; }
      button, select, input { min-height: 42px; border-radius: 8px; border: 1px solid #3d4651; background: #0d1117; color: #e6edf3; padding: 0 12px; }
      button { cursor: pointer; font-weight: 650; }
      button.primary { margin-top: 16px; width: 100%; background: #238636; border-color: #2ea043; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      #file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
      #status { min-height: 22px; margin: 14px 0 0; color: #9da7b3; }
      .results { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
      figure { margin: 0; min-height: 280px; border-radius: 12px; overflow: hidden; background: #05070a; border: 1px solid #30363d; }
      figcaption { padding: 10px 12px; background: #161b22; color: #b7c0ca; font-size: 13px; }
      img, canvas { display: block; width: 100%; height: 360px; object-fit: contain; }
      .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 12px; color: #9da7b3; }
      .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
      @media (max-width: 760px) { .controls, .results { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Spine-Contour</h1>
      <p>Automated vertebral-body segmentation from radiographs.</p>
      <section class="panel">
        <div class="controls">
          <label>Radiograph<button id="choose-file" type="button"><span id="file-name">Choose a file</span></button></label>
          <label>Modality<select id="modality"><option value="xray">X-ray</option></select></label>
          <label>Body part<select id="body-part"><option value="lumbar">Lumbar</option></select></label>
          <label>Laterality / view<select id="view"><option value="lateral">Lateral</option></select></label>
        </div>
        <label style="margin-top: 14px">Backend URL<input id="backend-url" value="http://127.0.0.1:8000/predict" /></label>
        <button id="predict" class="primary" type="button" disabled>Segment radiograph</button>
        <div id="status" role="status"></div>
        <div class="results">
          <figure><figcaption>Input</figcaption><img id="preview" alt="Selected radiograph preview" /></figure>
          <figure><figcaption>Vertebral-body mask</figcaption><canvas id="mask"></canvas></figure>
        </div>
        <div class="legend" id="legend"></div>
      </section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
