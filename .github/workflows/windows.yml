name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Download model weights
        run: git lfs pull

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt pyinstaller==6.22.2

      - name: Test backend
        run: python -m pytest backend/tests -q

      - name: Bundle backend
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --name spine-contour-backend
          --distpath backend-dist
          --workpath build/pyinstaller
          --paths .
          --collect-all segmentation_models_pytorch
          --collect-all timm
          --collect-all torchvision
          --collect-all uvicorn
          --add-data "backend/weights;backend/weights"
          backend/standalone.py

      - name: Verify bundled backend
        shell: pwsh
        run: |
          $backend = Start-Process "backend-dist/spine-contour-backend/spine-contour-backend.exe" -ArgumentList "--host", "127.0.0.1", "--port", "8765" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              try {
                $response = Invoke-RestMethod "http://127.0.0.1:8765/health"
                if ($response.status -eq "ok") { $ready = $true; break }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw "The bundled backend did not become ready." }
          } finally {
            Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run package:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v7
        with:
          name: Spine-Contour-Windows
          path: dist/Spine-Contour-Windows.exe
          compression-level: 0

      - name: Publish current Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "dist/Spine-Contour-Windows.exe"
          $notes = "Current Windows build from commit $env:GITHUB_SHA."
          if (gh release view latest-windows 2>$null) {
            gh release upload latest-windows $asset --clobber
            gh release edit latest-windows --target "$env:GITHUB_SHA" --title "Current Windows build" --notes $notes --latest
          } else {
            gh release create latest-windows $asset --target $env:GITHUB_SHA --title "Current Windows build" --notes $notes --latest
          }
