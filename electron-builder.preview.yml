# Preview build. Deliberately isolated from the production config in
# package.json on every axis that Windows or GitHub uses as an identity:
#   appId       -> separate uninstall registry entry (NOT an upgrade)
#   productName -> separate install dir, shortcuts, and %APPDATA% folder
#   artifactName-> separate installer filename
# Do not reuse appId, productName, or artifactName here. Other values (icon,
# nsis options, extraResources) are deliberately identical to production.
appId: org.spinecontour.app.preview
productName: Spine-Contour Preview

# MUST stay in sync with package.json "build.files". A missing entry does not
# fail the build; it ships an installer that opens a blank window.
files:
  - assets/**/*
  - index.html
  - main.js
  - preload.js
  - renderer/**/*
  - styles/**/*
  - package.json

extraResources:
  - from: backend-dist/spine-contour-backend
    to: backend-runtime
    filter:
      - "**/*"

# Injected into the packaged package.json. main.js reads buildChannel to decide
# whether to brand the window as a preview build. productName is what Electron's
# app.getName() returns, and userData is appData + app.getName() — without it both
# builds fall back to the `name` field ("spine-contour") and SHARE %APPDATA%.
# This productName must be kept identical to the top-level productName above:
# that one drives the install directory and shortcuts, this one drives
# app.getName() and therefore userData. If they diverge, the install
# directory and the data directory silently point at different places.
extraMetadata:
  buildChannel: preview
  productName: Spine-Contour Preview

win:
  target: nsis
  icon: assets/branding/spinecontour-mark-dark.png
  artifactName: Spine-Contour-Preview-Windows.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
