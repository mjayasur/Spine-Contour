<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The app mark: one vertebral body, matching the favicon at spine-contour.com. Transparent
       background, no fill, accent stroke. This is the light theme variant (accent #C1502B); the
       dark theme one is spinecontour-mark-dark.svg (accent #D45A32). The path is the same curve
       the landing hero draws for its third vertebra, and translate(0,7.75) centres it in the 64 box
       so the 7px stroke clears every edge. Keep this file valid XML: no double hyphen in comments. -->
  <path d="M16,4 C26,7 39,6.5 48,4 C54,2.5 58,5 57.5,10 C55.5,19 55.5,29 57.5,38 C58,43 54,45.5 48,44 C38,41 26,41 16,44 C10,45.5 6,43 6.5,38 C8.5,29 8,19 6.5,10 C6,5 10,2.5 16,4 Z"
        transform="translate(0,7.75)" fill="none" stroke="#C1502B" stroke-width="7" stroke-linejoin="round"/>
</svg>
